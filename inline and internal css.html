<!DOCTYPE html>
<html>
<head>
    <title>Practice Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        h1 {
            color: darkblue;
            text-align: center;
        }
        p {
            color: #333;
            padding: 10px;
        }
        .box {
            width: 200px;
            height: 100px;
            background-color: lightgreen;
            margin: 20px auto;
            text-align: center;
            line-height: 100px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1 style="font-size: 32px; text-decoration: underline;">My Practice Page</h1>
    <p style="font-size: 18px;">This is a paragraph with inline styling.</p>
    <div class="box">A simple box</div>
</body>
</html>
